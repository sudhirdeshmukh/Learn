# Spring Boot Application Configuration
# Design Patterns Learning Project

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Information
spring.application.name=Design Patterns Spring Boot

# Logging Configuration
logging.level.root=INFO
logging.level.com.learn.designpatterns=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# SpringDoc OpenAPI Configuration (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# API Documentation Info
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.showExtensions=true
